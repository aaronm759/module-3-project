<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Module 3 Project</title>
        <link rel="stylesheet" href="styles.css">
        <script src="https://kit.fontawesome.com/c8e4d183c2.js" crossorigin="anonymous"></script>
        <script src="index.js"></script>
    </head>
    <body>
        <header>
            <div class="logo__container">
                <figure class="logo__image">
                    <img src="assets/logo.2c489fc453a1783cbadacf914efa3df6.svg" alt="Logo">
                </figure>
                <p class="logo__text">Treact</p>
            </div>
            <nav class="nav__container">
                <a href="#" class="nav__links">About</a>
                <a href="#" class="nav__links">Blog</a>
                <a href="#" class="nav__links">Pricing</a>
                <a href="#" class="nav__links">Contact Us</a>
                <a href="#" class="nav__links" id="login">Login</a>
                <a href="#" class="nav__links" id="signup">Sign Up</a>
            </nav>           
        </header>
        <section class="landing">
            <div class="landing__text">
                <h1 class="landing__title">Beautiful React Templates<span>for you.</span></h1>
                <p class="landing__description">Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.
                </p>
                <form class="landing__form">
                    <input type="email" placeholder="Your E-mail Address" class="landing__input">
                    <button type="submit" class="landing__btn">Get Started</button>
                </form>
                <p class="landing__subtext">Our Trusted Customers</p>
                <figure class="landing__proof">
                    <img src="assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="Proof">
                </figure>
            </div>
            <figure class="landing__image">
                <img src="assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="Landing Image">
            </figure>
        </section>
    </body>
</html>
